name: Gerar Artigos DigitalTech

on:
  schedule:
    - cron: "0 9,17 * * *"   # 06h e 14h BRT (UTC-3)
  workflow_dispatch:
    inputs:
      sem_publicar:
        description: "Gerar como rascunho, sem publicar"
        type: boolean
        default: false
      publicar_pendentes:
        description: "Também publicar rascunhos pendentes"
        type: boolean
        default: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnóstico pré-execução
        run: |
          echo "=== Diagnóstico do Agente ==="
          python rodar_agente.py --diagnostico || true
          echo "=============================="
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.DIGITALTECH_PAT }}
          GITHUB_OWNER: "AdminFreitas"
          GITHUB_REPOSITORY: "digitaltech"

      - name: Executar pipeline de artigos
        run: |
          SEM_PUBLICAR="${{ github.event.inputs.sem_publicar }}"
          PUBLICAR_PENDENTES="${{ github.event.inputs.publicar_pendentes }}"
          ARGS="--tipo artigo"

          if [ "$SEM_PUBLICAR" = "true" ]; then
            ARGS="$ARGS --sem-publicar"
          fi

          echo "Executando: python workflow.py $ARGS"
          python workflow.py $ARGS

          if [ "$PUBLICAR_PENDENTES" = "true" ] && [ "$SEM_PUBLICAR" != "true" ]; then
            echo "Publicando rascunhos pendentes..."
            python rodar_agente.py --publicar || true
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_TIMEOUT: ${{ secrets.OLLAMA_TIMEOUT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.DIGITALTECH_PAT }}
          GITHUB_OWNER: "AdminFreitas"
          GITHUB_REPOSITORY: "digitaltech"
          PUBLICAR_IMEDIATAMENTE: "true"

      - name: Status pós-execução
        if: always()
        run: |
          echo "=== Status Final ==="
          python rodar_agente.py --status || true
          echo "===================="
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.DIGITALTECH_PAT }}