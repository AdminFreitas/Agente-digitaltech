name: Gerar Artigos DigitalTech

on:
  schedule:
    - cron: "0 9,17 * * *"   # 06h e 14h BRT (UTC-3)
  workflow_dispatch:

env:
  # --- Aplicação ---
  SECRET_KEY: ${{ secrets.SECRET_KEY }}

  # --- Banco de dados ---
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  # --- Provedores de IA ---
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
  KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # --- GitHub (publicação) ---
  GITHUB_TOKEN: ${{ secrets.DIGITALTECH_PAT }}
  GITHUB_OWNER: "AdminFreitas"
  GITHUB_REPOSITORY: "digitaltech"

  # --- Imagens ---
  UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

  # --- Pesquisa na web ---
  NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

  # --- Memória do agente ---
  SUPERMEMORY_API_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}

  # --- Redes sociais (futuro) ---
  LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
  LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
  EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
  WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
  FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
  FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
  X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}

  # --- Segurança ---
  ALLOWED_API_KEYS: ${{ secrets.ALLOWED_API_KEYS }}

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar artigo
        run: python rodar_agente.py --artigo

      - name: Gerar notícia
        if: always()
        run: python rodar_agente.py --noticia