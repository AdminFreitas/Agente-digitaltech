Isso ajuda muito — e resolve um mistério: pelo `runs-on: [self-hosted]` e pelo `docker compose exec`, o "Agente B" que a gente identificou lá atrás não é mais TypeScript rodando puro na nuvem do GitHub — é o **GitHub Actions como agendador**, disparando o **mesmo código Python** (Agente A) dentro de um runner self-hosted na sua própria máquina, via Docker. Isso elimina de vez o risco de duplicação entre "dois agentes" — é o mesmo pipeline, só dois jeitos de disparar (cron local ou Actions).

