name: Publicação Automática

on:
  schedule:
    - cron: '0 * * * *'   # roda no minuto 0 de toda hora, UTC
  workflow_dispatch: {}     # permite rodar manualmente pra testar

jobs:
  gerar-conteudo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do agente
        uses: actions/checkout@v4

      - name: Setup Python/Node
        uses: actions/setup-python@v5   # ou setup-node, conforme sua stack
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.DIGITALTECH_PAT }}
        run: python agente.py