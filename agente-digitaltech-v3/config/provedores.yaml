# ==========================================================
# Configuração de Provedores LLM — Agente DigitalTech
# ==========================================================
# Edite este arquivo para trocar modelos SEM alterar código.
# O agente lê esta config em tempo de execução.
#
# PRIORIDADE GERAL (fallback chain):
#   1. Ollama (local, gratuito)
#   2. OpenRouter → modelos na ordem definida abaixo
#   3. Se OpenRouter falhar (sem créditos, indisponível),
#      volta automaticamente para Ollama com modelos locais
# ==========================================================

# ----------------------------------------------------------
# Provedor Local (sempre gratuito, sempre disponível)
# ----------------------------------------------------------
local:
  enabled: true
  url: "${OLLAMA_URL}"
  model: "${OLLAMA_MODEL}"
  timeout: 180
  options:
    num_predict: 1800
    num_ctx: 4096
    temperature: 0.7
    top_p: 0.9
    keep_alive: "5m"

# ----------------------------------------------------------
# OpenRouter (hub central — uma chave só, múltiplos modelos)
# ----------------------------------------------------------
openrouter:
  enabled: true
  api_key: "${OPENROUTER_API_KEY}"
  base_url: "https://openrouter.ai/api/v1"
  timeout: 60
  # Headers obrigatórios do OpenRouter
  headers:
    HTTP-Referer: "https://www.digitaltech.digital/"
    X-Title: "Agente DigitalTech"

  # Modelos disponíveis via OpenRouter (ordem = prioridade de fallback)
  modelos:
    gpt-luna:
      id: "openai/gpt-5.6-luna"
      descricao: "Artigos principais — boa qualidade, custo moderado"

    claude-opus:
      id: "anthropic/claude-opus-5"
      descricao: "Escrita de alta qualidade — revisão e correção"

    gemini-flash:
      id: "google/gemini-3.6-flash"
      descricao: "Rápido e barato — SEO, resumos, tarefas leves"

    kimi-k3:
      id: "moonshotai/kimi-k3"
      descricao: "Backup geral"

    deepseek-flash:
      id: "deepseek/deepseek-v4-flash"
      descricao: "Último fallback — rápido e econômico"

# ----------------------------------------------------------
# Mapeamento por TIPO DE TAREFA
# ----------------------------------------------------------
# Define qual modelo usar para cada etapa do pipeline.
# Se o modelo falhar, o agente tenta o PRÓXIMO da lista
# de fallback do OpenRouter, e por último volta pro Ollama.
# ----------------------------------------------------------
tarefas:
  sugerir_tema:
    # Tarefa leve — Ollama é suficiente e gratuito
    preferencia: [local]

  pesquisar_briefing:
    preferencia: [local]

  escrever_artigo:
    # Artigos precisam de qualidade
    preferencia: [openrouter/gpt-luna, openrouter/claude-opus, openrouter/gemini-flash, local]

  escrever_noticia:
    # Notícias precisam ser rápidas
    preferencia: [openrouter/gemini-flash, openrouter/gpt-luna, openrouter/deepseek-flash, local]

  revisar:
    # Revisão gramatical — Claude é o melhor
    preferencia: [openrouter/claude-opus, openrouter/gpt-luna, local]

  seo:
    # SEO é tarefa leve e rápida
    preferencia: [openrouter/gemini-flash, openrouter/deepseek-flash, local]

  gerar_resumo:
    preferencia: [openrouter/deepseek-flash, openrouter/gemini-flash, local]

  gerar_texto_livre:
    # Fallback genérico — tenta tudo
    preferencia: [local, openrouter/gpt-luna, openrouter/claude-opus, openrouter/gemini-flash, openrouter/kimi-k3, openrouter/deepseek-flash]

# ----------------------------------------------------------
# Fallback quando créditos acabam
# ----------------------------------------------------------
# Se OpenRouter retornar erro 402 (Payment Required) ou 429 (Rate Limit),
# o agente automaticamente desativa o OpenRouter por N minutos
# e usa apenas Ollama.
# ----------------------------------------------------------
fallback_sem_creditos:
  desativar_openrouter_minutos: 30
  usar_apenas: [local]
