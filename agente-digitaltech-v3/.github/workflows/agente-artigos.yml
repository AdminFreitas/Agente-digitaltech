name: Gerar Conteúdo DigitalTech

on:
  schedule:
    - cron: "0 9,21 * * *"  # 06h e 18h BRT
  workflow_dispatch:
    inputs:
      tipo:
        description: "Tipo de conteúdo"
        type: choice
        options: [ambos, artigo, noticia]
        default: ambos
      sem_publicar:
        description: "Gerar como rascunho"
        type: boolean
        default: false
      publicar_pendentes:
        description: "Publicar rascunhos pendentes"
        type: boolean
        default: true

jobs:
  gerar:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnóstico pré-execução
        run: |
          echo "=== Diagnóstico ==="
          python rodar_agente.py --diagnostico || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}
          GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }}

      - name: Executar pipeline
        run: |
          TIPO="${{ github.event.inputs.tipo || 'ambos' }}"
          ARGS="--tipo $TIPO"
          [ "${{ github.event.inputs.sem_publicar }}" = "true" ] && ARGS="$ARGS --sem-publicar"
          python workflow.py $ARGS
          [ "${{ github.event.inputs.publicar_pendentes }}" = "true" ] && [ "${{ github.event.inputs.sem_publicar }}" != "true" ] && python rodar_agente.py --publicar || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_TIMEOUT: ${{ secrets.OLLAMA_TIMEOUT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}
          GITHUB_REPOSITORY: ${{ secrets.GITHUB_REPOSITORY }}
          PUBLICAR_IMEDIATAMENTE: "true"

      - name: Status pós-execução
        if: always()
        run: |
          echo "=== Status ==="
          python rodar_agente.py --status || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
